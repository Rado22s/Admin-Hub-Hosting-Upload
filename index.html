// Oprava: Striktné lokálne parsovanie dátumov bez UTC posunu (new Date("YYYY-MM-DD") parsuje ako UTC!)
function parseLocalYMD(dateStr){
  if(!dateStr || typeof dateStr !== 'string') return new Date();
  const parts = dateStr.split('-').map(Number);
  if(parts.length !== 3 || parts.some(isNaN)) return new Date();
  return new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0);
}
function formatLocalDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getLocalToday(){
  return formatLocalDate(new Date());
}
function daysAgoLocal(n){
  const d=new Date();
  d.setDate(d.getDate()-n);
  return formatLocalDate(d);
}
function getWeekRangeLocal(dateStr){
  const d=parseLocalYMD(dateStr);
  const day=d.getDay();
  const diffToMon = day===0 ? -6 : 1-day;
  const mon=new Date(d.getFullYear(), d.getMonth(), d.getDate()+diffToMon, 12, 0, 0);
  const sun=new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+6, 12, 0, 0);
  return {from: formatLocalDate(mon), to: formatLocalDate(sun)};
}
function getMonthRangeLocal(dateStr){
  const d=parseLocalYMD(dateStr);
  const first=new Date(d.getFullYear(), d.getMonth(), 1, 12, 0, 0);
  const last=new Date(d.getFullYear(), d.getMonth()+1, 0, 12, 0, 0);
  return {from: formatLocalDate(first), to: formatLocalDate(last)};
}

// Pomocne funkcie pre dokumenty: zobrazenie autora, casu nahratia a textovej ukazky.
function documentUserName(userId){
  const user = USERS.find(u => u.id === userId);
  return user ? user.name : (userId || 'Neznámy používateľ');
}
function documentDateValue(doc){
  const raw = doc?.uploadedAt || doc?.updatedAt || doc?.createdAt || doc?.date;
  if(!raw) return 0;
  const normalized = /^\d{4}-\d{2}-\d{2}$/.test(String(raw)) ? `${raw}T12:00:00` : raw;
  const n = new Date(normalized).getTime();
  return Number.isFinite(n) ? n : 0;
}
function documentDateLabel(doc){
  const stamp = documentDateValue(doc);
  if(!stamp) return doc?.date || 'Neznámy dátum';
  return new Date(stamp).toLocaleString('sk-SK', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function documentTextSnippet(doc, maxLen=700){
  let text = String(doc?.extractedText || '').trim();
  if(!text && doc?.currentContent && ['txt','md','csv','html'].includes(doc.type)){
    try{
      const raw = base64ToUtf8(dataURLtoBase64(doc.currentContent));
      if(doc.type === 'html'){
        const parsed = new DOMParser().parseFromString(sanitizeHtml(raw), 'text/html');
        text = parsed.body?.textContent || '';
      } else text = raw;
    }catch(e){}
  }
  text = text.replace(/\s+/g, ' ').trim();
  if(!text) return '';
  return text.length > maxLen ? text.slice(0, maxLen).trimEnd() + '…' : text;
}

// Oprava: Kompletná a konzistentná matica oprávnení (Lead má explicitne všetky práva)
const ROLE_PERMS = {
  Lead: ['create_topic','edit_topic','delete_topic','create_blog','edit_blog','delete_blog','create_post','edit_post','delete_post','upload_doc','delete_doc','delete_own_doc','pin_post','manage_checklist','manage_own_checklist','edit_tags','edit_own_tags','restore_version','restore_own_version','chat','view'],

};

function can(role, action, ownerId=null, currentUserId=null){
  const perms = ROLE_PERMS[role]||[];
  if(perms.includes(action)) return true;
  if(!ownerId || !currentUserId || ownerId !== currentUserId) return false;
  const ownMap = {
    delete_doc: 'delete_own_doc',
    edit_tags: 'edit_own_tags',
    restore_version: 'restore_own_version',
    edit_post: 'edit_own_post',
    delete_post: 'delete_own_post',
    manage_checklist: 'manage_own_checklist'
  };
  return ownMap[action] ? perms.includes(ownMap[action]) : false;
}

async function hashPassword(pw){
  const enc=new TextEncoder().encode(pw);
  const buf=await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const hexOf=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
async function pbkdf2(pw,saltHex){
  const salt=new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hexOf(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256));
}
async function makeCred(pw){ const s=hexOf(crypto.getRandomValues(new Uint8Array(16))); return {algo:'pbkdf2',salt:s,hash:await pbkdf2(pw,s),lastChanged:new Date().toISOString()}; }
async function verifyCred(pw,c){ if(!c||!c.hash||!c.salt) return false; return (await pbkdf2(pw,c.salt))===c.hash; }
async function verifyLegacySha256(pw,c){ if(!c||!c.hash) return false; if(c.salt) return false; return (await hashPassword(pw))===c.hash; }

function base64ToUtf8(base64){
  try{
    const binary=atob(base64);
    const bytes=Uint8Array.from(binary, c=>c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }catch(e){
    try{ return decodeURIComponent(escape(atob(base64))); }catch(e2){ return ''; }
  }
}
function dataURLtoBase64(dataURL){ return (dataURL||'').split(',')[1]||''; }
function dataURLtoBytes(dataURL){
  try{
    const base64=dataURLtoBase64(dataURL);
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return bytes;
  }catch(e){ return new Uint8Array(); }
}

// Extrakcia textu pre fulltext (TXT, CSV, HTML, XLSX, DOCX, PDF) — asynchrónne, neblokuje UI (yield via await)
async function extractSearchableText(type, dataUrl){
  if(!dataUrl) return '';
  try{
    if(['txt','csv','html'].includes(type)){
      const raw = base64ToUtf8(dataURLtoBase64(dataUrl));
      if(type==='html'){
        const tmp = document.createElement('div');
        tmp.innerHTML = sanitizeHtml(raw);
        return (tmp.textContent || tmp.innerText || '').slice(0, 50000);
      }
      return raw.slice(0, 50000);
    }
    if(type==='xlsx' && window.XLSX){
      const bytes = dataURLtoBytes(dataUrl);
      const wb = XLSX.read(bytes, {type:'array'});
      return wb.SheetNames.map(name => XLSX.utils.sheet_to_csv(wb.Sheets[name])).join('\n').slice(0, 50000);
    }
    if(type==='docx' && window.mammoth){
      const bytes = dataURLtoBytes(dataUrl);
      const res = await mammoth.extractRawText({arrayBuffer: bytes.buffer});
      return (res.value || '').slice(0, 50000);
    }
    if(type==='pdf' && window.pdfjsLib){
      try{
        const bytes = dataURLtoBytes(dataUrl);
        const pdf = await window.pdfjsLib.getDocument({data: bytes}).promise;
        let text = '';
        for(let i=1;i<=Math.min(pdf.numPages, 10);i++){
          const page = await pdf.getPage(i);
          const tc = await page.getTextContent();
          text += tc.items.map(it=>it.str).join(' ') + '\n';
          if(text.length>50000) break;
          // yield to UI
          await new Promise(r=>setTimeout(r,0));
        }
        return text.slice(0,50000);
      }catch(e){}
    }
  }catch(e){}
  return '';
}

// Reálna implementácia IndexedDB pre binárne obsahy dokumentov (odstraňuje 4.5 MB limit localStorage)
const IDB_NAME = 'admin_hub_idb_v6';
const IDB_STORE = 'doc_blobs';
function openIDB(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB) return reject(new Error('IndexedDB nepodporované'));
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbPut(key, val){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = ()=>{ db.close(); resolve(true); };
    tx.onerror = ()=>{ db.close(); reject(tx.error); };
  });
}
async function idbGet(key){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>{ db.close(); resolve(req.result ?? null); };
    req.onerror = ()=>{ db.close(); reject(req.error); };
  });
}
async function idbDel(key){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=>{ db.close(); resolve(true); };
    tx.onerror = ()=>{ db.close(); reject(tx.error); };
  });
}
async function idbClear(){
  const db = await openIDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete = ()=>{ db.close(); resolve(true); };
    tx.onerror = ()=>{ db.close(); reject(tx.error); };
  });
}

const STORAGE_LIMIT = 4.5*1024*1024;
const LOCAL_FALLBACK_LIMIT = 3.3*1024*1024; // reálny limit pre inline base64 v localStorage (bloat ~33%)
const MAX_FILE = 15*1024*1024; // Vďaka IndexedDB 15 MB/súbor, fallback do localStorage má limit 3.3 MB (base64 bloat) a kontroluje sa cez LOCAL_FALLBACK_LIMIT
const MAX_BLOG_HISTORY = 20;
const MAX_CHAT_MESSAGES = 200;
const MAX_DOC_VERSIONS = 10;
const HTML_PREVIEW_SANDBOX = '';

// Server-side shared document storage (PHP endpoint in ./api/documents.php).
// The access token is entered by a site administrator/user and kept in sessionStorage only.
const HOSTING_API_URL = new URL('./api/documents.php', window.location.href).toString();
const HOSTING_TOKEN_KEY = 'admin_hub_hosting_api_token_v1';
function getHostingToken(){ try{return sessionStorage.getItem(HOSTING_TOKEN_KEY)||'';}catch(e){return '';} }
async function hostingRequest(query='', init={}){
  let token=getHostingToken();
  if(!token){
    token=prompt('Zadaj tímové heslo pre privátne úložisko dokumentov na hostingu. Heslo nastav v api/config.php.');
    if(!token) throw new Error('Pripojenie k hostingu bolo zrušené.');
    try{sessionStorage.setItem(HOSTING_TOKEN_KEY,token);}catch(e){}
  }
  const headers=new Headers(init.headers||{});
  headers.set('X-Admin-Hub-Token',token);
  const response=await fetch(HOSTING_API_URL+query,{...init,headers,cache:'no-store',credentials:'same-origin'});
  if(response.status===401 || response.status===403){
    try{sessionStorage.removeItem(HOSTING_TOKEN_KEY);}catch(e){}
    throw new Error('Hosting odmietol heslo úložiska. Skontroluj hodnotu v api/config.php.');
  }
  if(!response.ok){
    let detail='HTTP '+response.status;
    try{const j=await response.clone().json(); if(j.error) detail=j.error;}catch(e){}
    throw new Error(detail);
  }
  return response;
}

}
async function blobAsDataURL(blob){
  return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Nepodarilo sa načítať súbor'));r.readAsDataURL(blob);});
}


// Striktná sanitizácia HTML + validácia a escapovanie URL (prevencia XSS v blogoch a DOCX)
function sanitizeHtml(h){
  if(!window.DOMPurify) return '<p>Sanitizér sa nenačítal — obsah nezobrazený.</p>';
  return window.DOMPurify.sanitize(String(h||''), {
    USE_PROFILES: {html: true},
    FORBID_TAGS: ['script','style','iframe','object','embed','form','input','button'],
    FORBID_ATTR: ['onerror','onload','onclick','onmouseover','onfocus','onblur']
  });
}
function sanitizeUrl(rawUrl){
  if(!rawUrl) return null;
  try{
    const u = new URL(rawUrl.trim());
    if(u.protocol !== 'http:' && u.protocol !== 'https:') return null;
    return u.href.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }catch(e){ return null; }
}

function normalizeLoaded(key, parsed){
  if(!Array.isArray(parsed)) return parsed;
  if(key.includes('docs')) return parsed.map((raw)=>{
    const {content: legacyContent, ...d} = raw;
    return {
      ...d,
      currentContent: d.hasIdbBlob ? '' : (d.currentContent ?? legacyContent ?? ''),
      extractedText: d.extractedText ?? '',
      tags: Array.isArray(d.tags) ? d.tags : [],
      isDemo: d.isDemo ?? false,
      versions: Array.isArray(d.versions) ? d.versions.slice(-MAX_DOC_VERSIONS).map((vv)=>{
        const {content: legacyV, ...v} = vv;
        return {
          ...v,
          currentContent: v.hasIdbBlob ? '' : (v.currentContent ?? legacyV ?? '')
        };
      }) : []
    };
  });
  if(key.includes('blogs')) return parsed.map(({currentContent, ...it})=>({
    ...it,
    content: sanitizeHtml(it.content ?? currentContent ?? ''),
    seoTags: Array.isArray(it.seoTags) ? it.seoTags : [],
    history: Array.isArray(it.history) ? it.history.slice(-MAX_BLOG_HISTORY) : []
  }));
  if(key.includes('posts')) return parsed.map(({currentContent, ...it})=>({
    ...it,
    content: it.content ?? currentContent ?? '',
    checklist: Array.isArray(it.checklist) ? it.checklist : []
  }));
  if(key.includes('chat')) return parsed.slice(-MAX_CHAT_MESSAGES);
  return parsed;
}
function serializeForStorage(key, state){
  if(key.includes('docs') && Array.isArray(state)){
    // V5: konzistentné — ak hasIdbBlob, neukladaj base64 do localStorage (IDB je zdroj pravdy)
    return state.map((doc)=>{
      const {content: legacyContent, ...d} = doc;
      return {
        ...d,
        currentContent: d.hasIdbBlob ? '' : (d.currentContent||''),
        versions: (d.versions||[]).slice(-MAX_DOC_VERSIONS).map((v)=>{
          const {content: legacyV, ...vv} = v;
          return {
            ...vv,
            currentContent: vv.hasIdbBlob ? '' : (vv.currentContent||'')
          };
        })
      };
    });
  }
  return state;
}
function isSessionValid(userId, expiry, now=Date.now()){ return !!userId && !!expiry && new Date(expiry).getTime() > now; }
function exceedsQuota(docs){ 
  const serialized = JSON.stringify(serializeForStorage('docs',docs));
  // Ak má dokument hasIdbBlob=false a currentContent je veľký base64, kontroluj aj LOCAL_FALLBACK_LIMIT
  const hasLargeInline = docs.some(d=>!d.hasIdbBlob && (d.currentContent||'').length > LOCAL_FALLBACK_LIMIT);
  return serialized.length > STORAGE_LIMIT || hasLargeInline;
}
function nextVersionNo(doc){ return Math.max(0,...(doc.versions||[]).map(v=>v.version||0))+1; }

function applyUpload(docs, file, content, userId, today, extractedText='', hasIdbBlob=false){
  const size=formatSize(file.size); const i=docs.findIndex(d=>d.name===file.name);
  const stamp = new Date().toISOString();
  if(i===-1){
    const id = 'd'+Date.now()+Math.random().toString(36).slice(2,5);
    return [...docs,{id,name:file.name,type:getFileType(file.name),size,authorId:userId,createdBy:userId,date:today,createdAt:stamp,uploadedAt:stamp,updatedAt:stamp,tags:[],versions:[],currentContent:content,extractedText,hasIdbBlob,isDemo:false}];
  }
  const e=docs[i]; const c=[...docs];
  const verNo = nextVersionNo(e);
  const newVer = {version:verNo,currentContent:e.currentContent,hasIdbBlob:!!e.hasIdbBlob,date:e.date,createdAt:e.updatedAt||e.uploadedAt||e.createdAt||null,uploadedAt:e.uploadedAt||e.updatedAt||e.createdAt||null,authorId:e.authorId,size:e.size};
  const trimmedVers = [...(e.versions||[]), newVer].slice(-MAX_DOC_VERSIONS);
  c[i]={...e,currentContent:content,extractedText,hasIdbBlob,date:today,uploadedAt:stamp,updatedAt:stamp,size,authorId:userId,createdBy:e.createdBy||e.authorId||userId,createdAt:e.createdAt||stamp,isDemo:false,versions:trimmedVers};
  return c;
}
function restoreVersionPure(doc, idx, userId, today){
  const ver=doc.versions?.[idx]; if(!ver||(!ver.currentContent && !ver.hasIdbBlob)) return null;
  const verNo = nextVersionNo(doc);
  const stamp = new Date().toISOString();
  const snapshotOld = {version:verNo,currentContent:doc.currentContent,hasIdbBlob:!!doc.hasIdbBlob,date:doc.date,createdAt:doc.updatedAt||doc.uploadedAt||doc.createdAt||null,uploadedAt:doc.uploadedAt||doc.updatedAt||doc.createdAt||null,authorId:doc.authorId,size:doc.size};
  return {...doc, currentContent:ver.currentContent, hasIdbBlob:!!ver.hasIdbBlob, size:ver.size, date:today, uploadedAt:stamp, updatedAt:stamp, authorId:userId,
    versions:[...doc.versions, snapshotOld].slice(-MAX_DOC_VERSIONS)};
}
function makeBlogSnapshot(b){ return {prevContent:sanitizeHtml(b.content), prevTitle:b.title, prevStatus:b.status, prevExcerpt:b.excerpt, prevSeoTags:b.seoTags||[], prevCategoryId:b.categoryId}; }

// Hook s automatickou migráciou v2 -> v3 -> v4 + Cross-Tab synchronizáciou (window 'storage' event)
function usePersistentState(key, initial, opts){
  const optsRef = React.useRef(opts); optsRef.current = opts;
  const lastSaved = React.useRef(null);
  const rolling = React.useRef(false);
  const [state, setState] = React.useState(()=>{
    const candidates = [key, key.replace('_v6','_v5'), key.replace('_v6','_v4'), key.replace('_v6','_v3'), key.replace('_v6','_v2')];
    for(const k of candidates){
      try{
        const raw=localStorage.getItem(k);
        if(raw){
          const v=normalizeLoaded(key, JSON.parse(raw));
          lastSaved.current=v;
          return v;
        }
      }catch(e){}
    }
    lastSaved.current=initial; return initial;
  });
  const [error, setError] = React.useState(null);

  React.useEffect(()=>{
    try{
      const str = JSON.stringify(serializeForStorage(key, state));
      if(str.length > STORAGE_LIMIT) throw new Error(`Dáta v localStorage sú príliš veľké (${(str.length/1024/1024).toFixed(2)} MB, limit ${(STORAGE_LIMIT/1024/1024).toFixed(1)} MB)`);
      localStorage.setItem(key, str);
      lastSaved.current = state;
      if(rolling.current) rolling.current=false; else setError(null);
      optsRef.current?.onSaved?.();
    }catch(e){
      rolling.current = true;
      setError(e.message);
      optsRef.current?.onFail?.(e.message);
      setState(lastSaved.current);
    }
  }, [key, state]);

  // Synchronizácia medzi tabmi: Storage event (metadáta) + BroadcastChannel (notifikácia o IDB blobe)
  React.useEffect(()=>{
    let bc = null;
    try{
      if(window.BroadcastChannel){
        bc = new BroadcastChannel('admin_hub_sync_v6');
        bc.onmessage = (ev)=>{
          if(ev.data && ev.data.key === key){
            try{
              // metadáta už v localStorage, IDB je zdieľaná (rovnaký origin) — stačí reload metadát
              const raw = localStorage.getItem(key);
              if(raw){
                const parsed = normalizeLoaded(key, JSON.parse(raw));
                lastSaved.current = parsed;
                setState(parsed);
              }
            }catch(err){}
          }
        };
      }
    }catch(e){}
    const onStorage = (e)=>{
      if(e.key === key && e.newValue){
        try{
          const parsed = normalizeLoaded(key, JSON.parse(e.newValue));
          lastSaved.current = parsed;
          setState(parsed);
        }catch(err){}
      }
    };
    window.addEventListener('storage', onStorage);
    return ()=>{
      window.removeEventListener('storage', onStorage);
      if(bc) try{ bc.close(); }catch(e){}
    };
  }, [key]);

  // Notifikácia ostatným tabom po úspešnom zápise
  React.useEffect(()=>{
    try{
      if(window.BroadcastChannel){
        const bc = new BroadcastChannel('admin_hub_sync_v6');
        bc.postMessage({key, t: Date.now()});
        bc.close();
      }
    }catch(e){}
  }, [state]);

  return [state, setState, error];
}

function getFileType(name){
  const ext=name.split('.').pop().toLowerCase();
  if(['pdf'].includes(ext)) return 'pdf';
  if(['jpg','jpeg','png','webp','gif','svg'].includes(ext)) return 'image';
  if(['xlsx','xls'].includes(ext)) return 'xlsx';
  if(['csv'].includes(ext)) return 'csv';
  if(['mp4','mov','webm','avi'].includes(ext)) return 'video';
  if(['docx','doc'].includes(ext)) return 'docx';
  if(['txt','md'].includes(ext)) return 'txt';
  if(['html','htm'].includes(ext)) return 'html';
  return 'file';
}
function formatSize(bytes){ if(bytes<1024) return bytes+' B'; if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB'; return (bytes/1024/1024).toFixed(1)+' MB'; }
function timeAgo(iso){ const diff=Date.now()-new Date(iso).getTime(); const m=Math.floor(diff/60000); if(m<1) return 'teraz'; if(m<60) return `pred ${m} min`; const h=Math.floor(m/60); if(h<24) return `pred ${h} h`; return `pred ${Math.floor(h/24)} d`; }

function parseCSVRobust(text){
  text = String(text || '').replace(/^\uFEFF/, '');
  const firstLine = (text.split(/\r?\n/)[0] || '').replace(/"(?:[^"]|"")*"/g, '');
  const count = c => firstLine.split(c).length - 1;
  const delimiter = [';', '\t', ','].reduce((best, c) => count(c) > count(best) ? c : best, ',');
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (ch === '"') {
      if (inQuotes && next === '"') { cell += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === delimiter && !inQuotes) {
      row.push(cell); cell = '';
    } else if ((ch === '\r' || ch === '\n') && !inQuotes) {
      if (ch === '\r' && next === '\n') i++;
      if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
    } else {
      cell += ch;
    }
  }
  if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); }
  return {delimiter, rows};
}

      const merged=[...docsRef.current.filter(d=>!d.hostingStorage), ...remotes];
      docsRef.current=merged;

  const getHostingBlob = async(doc, versionIdx=null)=>{

  const handleDownload = async (doc, versionIdx=null)=>{

        }catch(e){ setPreviewData({html:'', csvRows:[], xlsxRows:[], docxHtml:'', resolvedContent:content, error:'Súbor sa nepodarilo spracovať: '+(e&&e.message||e)}); }
      }else if(showPreview.type==='docx'){
        try{
          const bytes=dataURLtoBytes(content);
          mammoth.convertToHtml({arrayBuffer: bytes.buffer}).then(res=>{
            if(!cancelled) setPreviewData({html:'', csvRows:[], xlsxRows:[], docxHtml:sanitizeHtml(res.value), resolvedContent:content});
          }).catch(()=>!cancelled && setPreviewData({html:'', csvRows:[], xlsxRows:[], docxHtml:'<p>Chyba konverzie DOCX</p>', resolvedContent:content}));
        }catch(e){ setPreviewData({html:'', csvRows:[], xlsxRows:[], docxHtml:'', resolvedContent:content, error:'Súbor sa nepodarilo spracovať: '+(e&&e.message||e)}); }
      }else if(showPreview.type==='html'){
        const txt=base64ToUtf8(dataURLtoBase64(content));
        setPreviewData({html:txt, csvRows:[], xlsxRows:[], docxHtml:'', resolvedContent:content});
      }else{
        setPreviewData({html:'', csvRows:[], xlsxRows:[], docxHtml:'', resolvedContent:content});
      }
    })();
    return ()=>{ cancelled = true; };
  }, [showPreview]);

  const documentAuthors = [...new Set(docs.map(d=>d.authorId).filter(Boolean))].sort((a,b)=>documentUserName(a).localeCompare(documentUserName(b),'sk'));
  const visibleDocumentList = docs

      const haystack=[d.name,d.type,d.size,d.authorId,documentUserName(d.authorId),(d.tags||[]).join(' '),d.extractedText||''].join(' ').toLocaleLowerCase('sk');
      if(query && !haystack.includes(query)) return false;
      if(documentTypeFilter!=='all' && d.type!==documentTypeFilter) return false;
      if(documentAuthorFilter!=='all' && d.authorId!==documentAuthorFilter) return false;
      const dt = documentDateValue(d);
      if(documentDateFrom){ const from=new Date(documentDateFrom+'T00:00:00').getTime(); if(dt<from) return false; }
      if(documentDateTo){ const to=new Date(documentDateTo+'T23:59:59.999').getTime(); if(dt>to) return false; }
      return true;
    })
    .sort((a,b)=>{
      const nameA=(a.name||'').toLocaleLowerCase('sk'), nameB=(b.name||'').toLocaleLowerCase('sk');
      const authorA=documentUserName(a.authorId).toLocaleLowerCase('sk'), authorB=documentUserName(b.authorId).toLocaleLowerCase('sk');
      const sizeA=Number(String(a.size||'').replace(',','.').match(/[\d.]+/)?.[0]||0) * (/GB/i.test(a.size||'')?1024:(/KB/i.test(a.size||'')?1/1024:1));
      const sizeB=Number(String(b.size||'').replace(',','.').match(/[\d.]+/)?.[0]||0) * (/GB/i.test(b.size||'')?1024:(/KB/i.test(b.size||'')?1/1024:1));
      switch(documentSort){
        case 'oldest': return documentDateValue(a)-documentDateValue(b);
        case 'name_asc': return nameA.localeCompare(nameB,'sk');
        case 'name_desc': return nameB.localeCompare(nameA,'sk');
        case 'size_desc': return sizeB-sizeA;
        case 'size_asc': return sizeA-sizeB;
        case 'type_asc': return (a.type||'').localeCompare(b.type||'','sk') || nameA.localeCompare(nameB,'sk');
        case 'author_asc': return authorA.localeCompare(authorB,'sk') || nameA.localeCompare(nameB,'sk');
        case 'newest': default: return documentDateValue(b)-documentDateValue(a);
      }
    });

  if(isSettingUp){

                  <label className="text-xs">Hľadať názov, tag, typ alebo obsah

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3"><div className="md:col-span-2"><label className="text-xs font-medium">Fulltext (názov + tagy + extrahovaný obsah dokumentov, blogov a úloh)</label><input id="search-input" value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Hľadaj..." className="w-full mt-1 px-3 py-2 rounded-xl border bg-zinc-50 dark:bg-zinc-800"/></div><div><label className="text-xs font-medium">Typ</label><select value={searchContentType} onChange={e=>setSearchContentType(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl border bg-zinc-50 dark:bg-zinc-800"><option value="all">Všetko</option><option value="doc">Dokumenty</option><option value="blog">Blogy</option><option value="post">Príspevky</option></select></div></div>
                <div className="grid grid-cols-1 md:grid-cols-5 gap-3"><div><label className="text-xs font-medium">Dátum</label><select value={searchDate} onChange={e=>setSearchDate(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl border bg-zinc-50 dark:bg-zinc-800"><option value="all">Kedykoľvek</option><option value="today">Dnes (lokálne)</option><option value="week">Tento týždeň Po-Ne</option><option value="month">Tento mesiac</option><option value="custom">Vlastný</option></select></div>{searchDate==='custom' && <><div><label className="text-xs font-medium">Od</label><input type="date" value={searchDateFrom} onChange={e=>setSearchDateFrom(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl border bg-white dark:bg-zinc-800"/></div><div><label className="text-xs font-medium">Do</label><input type="date" value={searchDateTo} onChange={e=>setSearchDateTo(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl border bg-white dark:bg-zinc-800"/></div></>}<div><label className="text-xs font-medium">Stav blogu</label><select value={searchStatus} onChange={e=>setSearchStatus(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl border bg-zinc-50 dark:bg-zinc-800"><option value="all">Všetky</option><option value="publikovaný">publikovaný</option><option value="koncept">koncept</option><option value="archív">archív</option></select></div><div><label className="text-xs font-medium">Autor</label><select value={authorFilter} onChange={e=>setAuthorFilter(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-xl border bg-zinc-50 dark:bg-zinc-800"><option value="all">Všetci</option><option value="me">Moje</option></select></div></div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3"><div><label className="text-xs font-medium">Tagy (case-insensitive)</label><input placeholder="brand, report" value={searchTags.join(',')} onChange={e=>setSearchTags(e.target.value.split(',').map(s=>s.trim()).filter(Boolean))} className="w-full mt-1 px-3 py-2 rounded-xl border bg-zinc-50 dark:bg-zinc-800"/></div><div className="flex items-end gap-2"><label className="flex items-center gap-2 text-xs"><input type="checkbox" checked={pinnedOnly} onChange={e=>setPinnedOnly(e.target.checked)}/> Len pripnuté</label></div><div className="flex items-end"><button onClick={resetAllFilters} className="w-full px-3 py-2 rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-sm">Reset všetkých filtrov</button></div></div>
              </div>
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4"><div className="space-y-2"><h3 className="font-semibold text-sm">Dokumenty ({filteredDocs.length})</h3>{filteredDocs.map(d=><div key={d.id} onClick={()=>setShowPreview(d)} className="p-3 rounded-xl bg-white dark:bg-zinc-900 border text-sm cursor-pointer hover:border-zinc-400"><div className="font-medium">{d.name}</div><div className="text-[11px] text-zinc-500">{d.date} • {(d.tags||[]).join(', ')} • {d.authorId}</div></div>)}</div><div className="space-y-2"><h3 className="font-semibold text-sm">Blogy ({filteredBlogs.length})</h3>{filteredBlogs.map(b=><div key={b.id} onClick={()=>setReadingBlog(b)} className="p-3 rounded-xl bg-white dark:bg-zinc-900 border text-sm cursor-pointer hover:border-zinc-400"><div className="font-medium">{b.title}</div><div className="text-[11px] text-zinc-500">{b.date} • {b.status} • {b.authorId}</div></div>)}</div><div className="space-y-2"><h3 className="font-semibold text-sm">Príspevky ({filteredPosts.length})</h3>{filteredPosts.map(p=><div key={p.id} className="p-3 rounded-xl bg-white dark:bg-zinc-900 border text-sm"><div>{p.content}</div><div className="text-[11px] text-zinc-500">{p.date} • {p.type}</div></div>)}</div></div>
            </div>
          )}

          {section==='audit' && (
            <div className="space-y-5">
              <h2 className="text-2xl font-bold">Audit v6 — reálne testy (PASS/ARCHITEKTÚRA/NEOVERENÉ)</h2>
              <div className="p-5 rounded-2xl bg-white dark:bg-zinc-900 border">
                <div className="space-y-2">
                  {auditTests.map((t,i)=>(
                    <div key={i} className={`flex gap-3 text-sm p-2.5 rounded-xl border ${t.status==='PASS' ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-200 dark:border-emerald-800' : t.status==='ARCHITEKTÚRA' ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-200 dark:border-amber-800' : 'bg-red-50 border-red-200'}`}>
                      <span>{t.status==='PASS' ? '✅' : t.status==='ARCHITEKTÚRA' ? '⚠️' : '❌'}</span><div className="flex-1"><div className="font-medium">{i+1}. {t.name} — {t.status}</div><div className="text-xs text-zinc-600 dark:text-zinc-400">{t.detail}</div></div>
                    </div>
                  ))}
                </div>
                <button onClick={()=>runRealTests().then(setAuditTests)} className="mt-4 px-4 py-2 rounded-xl border text-sm">Spustiť testy znova</button>
              </div>
            </div>
          )}

          {section==='settings' && (
            <div className="space-y-5">
              <h2 className="text-2xl font-bold">Nastavenia v6</h2>
              <div className="p-5 rounded-2xl bg-white dark:bg-zinc-900 border space-y-4">
                <div><div className="font-medium text-sm">Zmena hesla (PBKDF2 + soľ, vyžaduje staré heslo)</div><div className="flex gap-2 mt-2"><input type="password" placeholder="Staré heslo" value={oldPw} onChange={e=>setOldPw(e.target.value)} className="flex-1 px-3 py-2 rounded-xl border bg-white dark:bg-zinc-800"/><input type="password" placeholder="Nové min. 8 znakov" value={newPw} onChange={e=>setNewPw(e.target.value)} className="flex-1 px-3 py-2 rounded-xl border bg-white dark:bg-zinc-800"/><button onClick={handleChangePassword} className="px-4 py-2 rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-900">Zmeniť</button></div></div>
                <div className="border-t pt-4"><div className="font-medium text-sm">Úložisko dokumentov</div><div className="text-xs text-zinc-500">Dokumenty označené HOSTING sú uložené v privátnom priečinku na serveri cez PHP API. Staršie lokálne záznamy zostávajú v IndexedDB/localStorage. Na tímové zdieľanie pripoj hosting v sekcii Dokumenty.</div>{docsError && <div className="mt-2 text-xs text-red-600">{docsError}</div>}<button onClick={async()=>{ if(confirm('Vymazať všetky dáta v localStorage aj IndexedDB?')){ try{ await idbClear(); }catch(e){} try{
        await idbClear();
      }catch(e){
        showToast('IndexedDB sa nepodarilo vymazať: '+(e?.message||e),'error');
        return;
      }
      Object.keys(localStorage).filter(k=>k.startsWith('admin_hub_')).forEach(k=>localStorage.removeItem(k)); location.reload(); } }} className="mt-2 text-xs px-3 py-1.5 rounded-xl border border-red-200 text-red-600">Vymazať localStorage + IndexedDB</button></div>
              </div>
            </div>
          )}

        </div>
      </div>

      {/* Globálny preview modal */}
      {showPreview && (
        <div className="fixed inset-0 z-50 bg-black/50 p-6 flex items-center justify-center">
          <div className="w-full max-w-3xl bg-white dark:bg-zinc-900 rounded-2xl border p-4 max-h-[90vh] overflow-auto">
            <div className="flex flex-wrap justify-between gap-3 mb-3"><div><div className="font-semibold break-words">{showPreview.name} <span className="text-[10px] mono text-zinc-500">{showPreview.type} • {showPreview.size}</span></div><div className="text-[11px] text-zinc-500 mt-1">Aktuálnu verziu nahral: {documentUserName(showPreview.authorId)} · {documentDateLabel(showPreview)}</div></div><div className="flex gap-2 shrink-0"><button onClick={()=>handleDownload(showPreview)} className="px-3 py-1 rounded-lg border">Stiahnuť</button><button onClick={()=>{setShowPreview(null); history.replaceState(null,'',window.location.pathname);}} className="px-3 py-1 rounded-lg border">Zavrieť</button></div></div>
            <div>
              {(()=>{
                const content=previewData.resolvedContent;
                if(!content) return <div className="text-sm text-zinc-500">DEMO dokument bez binárneho obsahu (textový index: {showPreview.extractedText || 'žiadny'})</div>;
                if(previewData.error && ['csv','xlsx','docx'].includes(showPreview.type)) return <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-800">{previewData.error}</div>;
                if(showPreview.type==='image') return <img src={content} className="max-w-full rounded-xl"/>;
                if(showPreview.type==='video') return <video src={content} controls className="w-full rounded-xl"/>;
                if(showPreview.type==='pdf') return <iframe src={content} className="w-full h-[60vh] rounded-xl border" title="pdf"/>;
                if(showPreview.type==='html'){
                  return <div><div className="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 p-2 rounded-xl mb-2">⚠️ HTML náhľad: sandbox="" (blokuje skripty) + DOMPurify sanitizácia (odstraňuje on* atributy). Pre maximálnu bezpečnosť.</div><iframe sandbox={HTML_PREVIEW_SANDBOX} srcDoc={sanitizeHtml(previewData.html)} className="w-full h-[60vh] rounded-xl border bg-white" title="html preview"/></div>;
                }
                if(showPreview.type==='csv'){
                  return <div className="overflow-auto"><div className="text-[11px] mono mb-2">Delimiter: {previewData.delimiter || ','}</div><table className="text-xs border-collapse">{previewData.csvRows.map((row,i)=><tr key={i}>{row.map((cell,j)=><td key={j} className="border px-2 py-1">{cell}</td>)}</tr>)}</table></div>;
                }
                if(showPreview.type==='xlsx'){
                  return <div className="overflow-auto"><div className="text-[11px] mono mb-2">XLSX via SheetJS (prvých 50 riadkov)</div><table className="text-xs border-collapse">{previewData.xlsxRows.map((row,i)=><tr key={i}>{row.map((cell,j)=><td key={j} className="border px-2 py-1">{String(cell??'')}</td>)}</tr>)}</table></div>;
                }
                if(showPreview.type==='docx'){
                  return <div><div className="text-[11px] mono mb-2">DOCX via Mammoth.js + DOMPurify</div><div className="prose prose-sm max-w-none p-3 bg-white dark:bg-zinc-800 rounded-xl border" dangerouslySetInnerHTML={{__html: previewData.docxHtml || '<p>Načítavam...</p>'}}></div></div>;
                }
                if(showPreview.type==='txt'){
                  const txt=base64ToUtf8(dataURLtoBase64(content));
                  return <pre className="text-xs p-3 bg-zinc-50 dark:bg-zinc-800 rounded-xl whitespace-pre-wrap">{txt}</pre>;
                }
                return <div className="text-sm">Typ {showPreview.type} — použite Stiahnuť. Verzie: {showPreview.versions?.length||0}</div>;
              })()}
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
